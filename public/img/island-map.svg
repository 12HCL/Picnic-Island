<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustrated map of Picnic Island" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Picnic Island</title>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a90c4"/>
      <stop offset="55%"  stop-color="#1f7cb0"/>
      <stop offset="100%" stop-color="#17648f"/>
    </linearGradient>

    <radialGradient id="shallow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7fd4e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7fd4e8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6fbf6a"/>
      <stop offset="100%" stop-color="#4e9d55"/>
    </linearGradient>

    <linearGradient id="lagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8fe0ef"/>
      <stop offset="100%" stop-color="#4bb8d6"/>
    </linearGradient>
  </defs>

  <!-- ============ Sea ============ -->
  <rect width="1600" height="900" fill="url(#sea)"/>

  <!-- gentle wave marks -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 80 120 q 28 -14 56 0 t 56 0"/>
    <path d="M 1360 190 q 28 -14 56 0 t 56 0"/>
    <path d="M 130 700 q 28 -14 56 0 t 56 0"/>
    <path d="M 1400 760 q 28 -14 56 0 t 56 0"/>
    <path d="M 1450 460 q 28 -14 56 0 t 56 0"/>
    <path d="M 60 400 q 28 -14 56 0 t 56 0"/>
  </g>

  <!-- shallow water halo around the island -->
  <ellipse cx="800" cy="470" rx="700" ry="430" fill="url(#shallow)"/>

  <!-- ============ Island ============ -->
  <!-- sand -->
  <path fill="#f2dfae" stroke="#e3cb92" stroke-width="4"
        d="M 800 130
           C 1010 140 1180 210 1290 330
           C 1380 430 1400 560 1330 660
           C 1250 770 1060 825 880 810
           C 700 795 520 780 390 700
           C 260 620 205 470 265 350
           C 330 225 590 120 800 130 Z"/>

  <!-- vegetation -->
  <path fill="url(#land)"
        d="M 800 190
           C 980 198 1130 255 1225 360
           C 1300 445 1318 555 1258 640
           C 1188 735 1030 782 880 770
           C 725 757 575 743 465 675
           C 355 607 310 480 360 382
           C 415 275 630 182 800 190 Z"/>

  <!-- inland lagoon (east) -->
  <ellipse cx="1248" cy="522" rx="98" ry="66" fill="url(#lagoon)" stroke="#f2dfae" stroke-width="7"/>

  <!-- ============ Paths ============ -->
  <g stroke="#e8d7a8" stroke-width="11" fill="none" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M 800 150 L 790 300 L 768 450"/>
    <path d="M 768 450 L 620 400 L 528 342"/>
    <path d="M 768 450 L 890 380 L 992 306"/>
    <path d="M 768 450 L 640 520 L 420 545 L 300 558"/>
    <path d="M 768 450 L 900 520 L 1140 520"/>
    <path d="M 768 450 L 820 640 L 880 780"/>
  </g>

  <!-- ============ Landmarks ============ -->

  <!-- North jetty -->
  <g>
    <rect x="788" y="86" width="24" height="70" rx="4" fill="#b98a5a"/>
    <rect x="762" y="82" width="76" height="12" rx="4" fill="#a5764a"/>
  </g>

  <!-- South jetty -->
  <g>
    <rect x="868" y="770" width="24" height="70" rx="4" fill="#b98a5a"/>
    <rect x="842" y="828" width="76" height="12" rx="4" fill="#a5764a"/>
  </g>

  <!-- Hotel (west) -->
  <g>
    <rect x="486" y="316" width="46" height="46" rx="4" fill="#fdfcf7" stroke="#c9c2ad" stroke-width="3"/>
    <rect x="536" y="330" width="34" height="32" rx="4" fill="#fdfcf7" stroke="#c9c2ad" stroke-width="3"/>
    <path d="M 480 316 L 509 292 L 538 316 Z" fill="#d9603f"/>
    <path d="M 532 330 L 553 314 L 574 330 Z" fill="#d9603f"/>
  </g>

  <!-- Visitor centre (middle) -->
  <g>
    <rect x="740" y="428" width="56" height="40" rx="5" fill="#fdfcf7" stroke="#c9c2ad" stroke-width="3"/>
    <path d="M 733 428 L 768 402 L 803 428 Z" fill="#3f7fbf"/>
    <rect x="762" y="446" width="14" height="22" fill="#3f7fbf"/>
  </g>

  <!-- Coaster (east-north) -->
  <g fill="none" stroke="#e0533c" stroke-width="9" stroke-linecap="round">
    <path d="M 950 330 C 966 282 998 282 1012 322 C 1024 356 1046 356 1058 326"/>
  </g>
  <g fill="#8a6a4a">
    <rect x="958" y="330" width="7" height="26"/>
    <rect x="1006" y="326" width="7" height="30"/>
    <rect x="1052" y="330" width="7" height="26"/>
  </g>

  <!-- Beach umbrellas (west shore) -->
  <g>
    <g transform="translate(272,558)">
      <rect x="-2" y="-2" width="5" height="26" fill="#8a6a4a"/>
      <path d="M -26 0 a 26 26 0 0 1 52 0 Z" fill="#e0533c"/>
    </g>
    <g transform="translate(330,596)">
      <rect x="-2" y="-2" width="5" height="22" fill="#8a6a4a"/>
      <path d="M -21 0 a 21 21 0 0 1 42 0 Z" fill="#f0a93f"/>
    </g>
  </g>

  <!-- palms -->
  <g>
    <g transform="translate(640,270)">
      <rect x="-3" y="0" width="7" height="34" fill="#8a6a4a"/>
      <g fill="#2f8f4e">
        <ellipse cx="-18" cy="-4" rx="20" ry="8"/>
        <ellipse cx="18"  cy="-4" rx="20" ry="8"/>
        <ellipse cx="0"   cy="-14" rx="8" ry="16"/>
      </g>
    </g>
    <g transform="translate(1080,640)">
      <rect x="-3" y="0" width="7" height="34" fill="#8a6a4a"/>
      <g fill="#2f8f4e">
        <ellipse cx="-18" cy="-4" rx="20" ry="8"/>
        <ellipse cx="18"  cy="-4" rx="20" ry="8"/>
        <ellipse cx="0"   cy="-14" rx="8" ry="16"/>
      </g>
    </g>
    <g transform="translate(500,640)">
      <rect x="-3" y="0" width="7" height="30" fill="#8a6a4a"/>
      <g fill="#2f8f4e">
        <ellipse cx="-16" cy="-4" rx="18" ry="7"/>
        <ellipse cx="16"  cy="-4" rx="18" ry="7"/>
        <ellipse cx="0"   cy="-12" rx="7" ry="14"/>
      </g>
    </g>
    <g transform="translate(900,220)">
      <rect x="-3" y="0" width="7" height="30" fill="#8a6a4a"/>
      <g fill="#2f8f4e">
        <ellipse cx="-16" cy="-4" rx="18" ry="7"/>
        <ellipse cx="16"  cy="-4" rx="18" ry="7"/>
        <ellipse cx="0"   cy="-12" rx="7" ry="14"/>
      </g>
    </g>
  </g>

  <!-- compass -->
  <g transform="translate(1470,120)" opacity="0.9">
    <circle r="42" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M 0 -30 L 9 0 L 0 8 L -9 0 Z" fill="#d9603f"/>
    <path d="M 0 30 L 9 0 L 0 -8 L -9 0 Z" fill="#4a6272"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4a6272">N</text>
  </g>

  <!-- island name -->
  <text x="90" y="105" font-family="Georgia, serif" font-size="34"
        fill="#ffffff" fill-opacity="0.94" letter-spacing="6">PICNIC ISLAND</text>
</svg>
